[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "async-claim-audit"
version = "0.1.0"
description = "Audit documented awaitability promises against static Python evidence."
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []
readme = "README.md"

[project.scripts]
async-claim-audit = "async_claim_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
